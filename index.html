<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050711" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexOS" />
    <link rel="icon" href="/nexos-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/nexos-mark.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>NexOS</title>
    <style>
      html,body,#root{margin:0;width:100%;height:100%;min-height:100%;background:#050711;color:#e9efff}
      #nexos-startup-fallback{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:#050711;font:12px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#e9efff}
      #nexos-startup-fallback__box{text-align:center;padding:10px}
      #nexos-startup-fallback img{display:block;width:46px;height:46px;margin:0 auto 7px}
      #nexos-startup-fallback strong{display:block;font-size:16px;letter-spacing:.12em;font-weight:650}
      #nexos-startup-fallback span{display:block;margin-top:5px;font-size:9px;color:#8d9ab8}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="nexos-startup-fallback" aria-label="Abrindo NexOS">
        <div id="nexos-startup-fallback__box">
          <img src="/nexos-mark.svg" alt="" />
          <strong>NexOS</strong>
          <span>Abrindo seu espaço…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        var fallback = document.getElementById('nexos-startup-fallback');
        if (fallback && document.getElementById('root').children.length > 1) fallback.remove();
      });
    </script>
  </body>
</html>
