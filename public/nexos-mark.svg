<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NexOS</title>
  <desc id="desc">Marca do NexOS: estrela fina de quatro pontas com núcleo central.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#cbd8ff"/>
    </radialGradient>
    <linearGradient id="mark" x1="18%" y1="10%" x2="82%" y2="90%">
      <stop stop-color="#8eeaff"/>
      <stop offset="0.5" stop-color="#78b8ff"/>
      <stop offset="1" stop-color="#a783ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="#070b18"/>
  <path d="M256 78c15 83 48 132 132 150-84 18-117 67-132 150-15-83-48-132-132-150 84-18 117-67 132-150Z" fill="url(#mark)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="48" fill="url(#core)"/>
</svg>
